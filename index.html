<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Waradise</title>
  <style>
    :root { color-scheme: light dark; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: Georgia, "Times New Roman", serif;
      background: #f4f0e8;
      color: #1c1915;
    }
    main { max-width: 36rem; padding: 2rem; }
    p { line-height: 1.5; }
    .mark { letter-spacing: 0.18em; text-transform: uppercase; font-family: system-ui, sans-serif; font-size: 0.75rem; }
  </style>
</head>
<body>
  <main>
    <p class="mark">Waradise</p>
    <h1>Hello, storefront.</h1>
    <p>
      This is the seed for an online store. The commerce engine will be
      <a href="https://medusajs.com">Medusa</a>, an open-source TypeScript backend,
      with a Next.js storefront in front of it.
    </p>
  </main>
</body>
</html>
